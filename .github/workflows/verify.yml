name: verify

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: verify-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-boot:
        name: build-and-boot
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Install build tools
              run: |
                  sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils clang e2fsprogs ffmpeg gcc grub-common grub-pc-bin lld make mtools \
                      python3-cryptography qemu-system-x86 xorriso
            - name: Install the Rust bare-metal target
              run: rustup target add x86_64-unknown-none
            - name: Record QEMU fixture capabilities
              run: |
                  qemu-system-x86_64 -version
                  qemu-system-x86_64 -device qemu-xhci,help
                  qemu-system-x86_64 -device usb-kbd,help
                  qemu-system-x86_64 -device nvme,help
            - name: Verify the kernel artifact
              run: make verify
            - name: Capture the authenticated minimal desktop from QEMU
              run: |
                  make iso
                  python3 tools/capture-rsd-proof.py \
                      --iso build/rsd.iso \
                      --system build/userspace/rsd-system-fat32.raw \
                      --data build/userspace/rsd-data-fat32.raw \
                      --output build/rsd-captures
                  python3 tools/compare-rsd-proof-screenshot.py --mode clean \
                      assets/rsd/proof.png \
                      build/rsd-captures/rsd-proof.png
                  python3 tools/compare-rsd-proof-screenshot.py --mode focus \
                      assets/rsd/proof-focus.png \
                      build/rsd-captures/rsd-proof-focus.png
                  python3 tools/compare-rsd-proof-screenshot.py --mode terminal \
                      assets/rsd/proof-terminal.png \
                      build/rsd-captures/rsd-proof-terminal.png
                  python3 tools/fat32_image.py inspect \
                      build/rsd-captures/rsd-proof-data.raw \
                      --report build/rsd-captures/fat32-report.json
                  python3 - <<'PY'
                  import json
                  from pathlib import Path

                  captures = Path("build/rsd-captures")
                  required = (
                      "rsd-proof.png",
                      "rsd-proof-focus.png",
                      "rsd-proof-terminal.png",
                  )
                  for name in required:
                      if not (captures / name).is_file():
                          raise SystemExit(f"missing QEMU UI evidence: {name}")
                  report = json.loads((captures / "fat32-report.json").read_text())
                  if (not report["fat_copies_match"] or report["cycles"] != 0 or
                          report["cross_links"] != 0 or
                          report["leaked_clusters"] != 0):
                      raise SystemExit("desktop capture FAT32 audit failed")
                  PY
            - name: Upload RSD desktop captures
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: rsd-desktop-captures
                  path: build/rsd-captures
                  if-no-files-found: error
            - name: Prove faults and interrupts in QEMU
              run: |
                  make qemu-test-ext4-recovery
                  make qemu-test-ext4-powercuts
                  make qemu-test-rsd-proof-userland-interactive
                  make qemu-test-fat32-data
                  make qemu-test-fat32-nested qemu-test-fat32-growth \
                      qemu-test-fat32-random qemu-test-fat32-truncate \
                      qemu-test-fat32-rename qemu-test-fat32-delete \
                      qemu-test-fat32-full qemu-test-fat32-corrupt \
                      qemu-test-fat32-missing qemu-test-fat32-persistence \
                      qemu-test-fat32-cache qemu-test-fat32-immutable \
                      qemu-test-fat32-handles
                  make qemu-tests
            - name: Upload ext4 durability evidence
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: rsd-ext4-powercuts
                  path: build/tests/ext4-powercuts
                  if-no-files-found: error
