name: Production networking exact-head evidence

on:
    workflow_dispatch:
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: networking-milestone-${{ github.event.pull_request.head.sha || github.sha }}
    cancel-in-progress: true

jobs:
    exact-head-evidence:
        name: production-networking-exact-head-evidence
        runs-on: ubuntu-24.04
        timeout-minutes: 360
        outputs:
            head: ${{ steps.identity.outputs.head }}
            artifact: ${{ steps.identity.outputs.artifact }}
        steps:
            - name: Check out the exact PR head
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Establish immutable source identities
              id: identity
              env:
                  EVENT_BASE: ${{ github.event.pull_request.base.sha }}
                  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin main
                  head=$(git rev-parse HEAD)
                  test "$head" = "$EXPECTED_HEAD"
                  if test -n "$EVENT_BASE"; then
                      base="$EVENT_BASE"
                  else
                      base=$(git rev-parse origin/main)
                  fi
                  base_tree=$(git rev-parse "$base^{tree}")
                  source_tree=$(git rev-parse 'HEAD^{tree}')
                  merge_tree=$(git merge-tree --write-tree "$base" "$head")
                  artifact="OpenRFS-networking-milestone-$head"
                  {
                      printf 'EVIDENCE_HEAD=%s\n' "$head"
                      printf 'EVIDENCE_BASE=%s\n' "$base"
                      printf 'EVIDENCE_BASE_TREE=%s\n' "$base_tree"
                      printf 'EVIDENCE_SOURCE_TREE=%s\n' "$source_tree"
                      printf 'EVIDENCE_MERGE_TREE=%s\n' "$merge_tree"
                      printf 'EVIDENCE_NOT_BEFORE=%s\n' "$(date +%s)"
                      printf 'EVIDENCE_ARTIFACT=%s\n' "$artifact"
                  } >>"$GITHUB_ENV"
                  printf 'head=%s\n' "$head" >>"$GITHUB_OUTPUT"
                  printf 'artifact=%s\n' "$artifact" >>"$GITHUB_OUTPUT"

            - name: Install build, filesystem, packet, and emulation tools
              shell: bash
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils build-essential bzip2 ca-certificates clang \
                      e2fsprogs file grub-common grub-pc-bin lld make mtools \
                      openssl qemu-system-x86 qemu-user strace xorriso
                  rustup target add x86_64-unknown-none

            - name: Record toolchain and loop-device baseline
              shell: bash
              run: |
                  set -euo pipefail
                  log_dir="$RUNNER_TEMP/openrfs-network-logs"
                  mkdir -p "$log_dir"
                  {
                      gcc --version | head -1
                      clang --version | head -1
                      ld --version | head -1
                      rustc --version
                      cargo --version
                      python3 --version
                      qemu-system-x86_64 --version | head -1
                  } >"$log_dir/toolchain-versions.txt"
                  loop_before="$log_dir/loop-devices-before.txt"
                  losetup --list --noheadings --output NAME,BACK-FILE \
                      | sort >"$loop_before"
                  if ! test -s "$loop_before"; then
                      printf '<none>\n' >"$loop_before"
                  fi

            - name: Verify host matrices, parsers, and source hygiene
              shell: bash
              run: |
                  set -euo pipefail
                  log_dir="$RUNNER_TEMP/openrfs-network-logs"
                  python3 -m py_compile \
                      tools/network_fixture.py \
                      tools/network_packet_audit.py \
                      tools/run_network_scenario.py \
                      tools/network_evidence.py \
                      tools/write_qemu_result.py \
                      tools/https_network_fixture.py
                  python3 tools/network_fixture.py --self-test \
                      | tee "$log_dir/network-fixture-self-test.log"
                  make verify | tee "$log_dir/make-verify.log"
                  git diff --check

            - name: Run all 115 production QEMU scenarios
              shell: bash
              run: |
                  set -euo pipefail
                  log_dir="$RUNNER_TEMP/openrfs-network-logs"
                  read -r expected_scenarios expected_assertions < <(
                      make --no-print-directory -s contract-counts
                  )
                  scenario_count=$(
                      make --no-print-directory -s contract-scenarios | wc -l
                  )
                  network_count=$(
                      make --no-print-directory -s contract-scenarios \
                          | grep -c '^network-'
                  )
                  assertion_count=$(grep -c 'grep -F\|grep -E' Makefile)
                  test "$expected_scenarios" -eq 115
                  test "$scenario_count" -eq 115
                  test "$network_count" -eq 36
                  test "$assertion_count" -eq "$expected_assertions"
                  make qemu-tests QEMU_ACCEL=tcg \
                      | tee "$log_dir/all-qemu-scenarios.txt"
                  test "$(grep -Ec '^QEMU scenario [a-z0-9-]+ passed$' \
                      "$log_dir/all-qemu-scenarios.txt")" -eq 115
                  test "$(grep -Ec '^QEMU scenario network-[a-z0-9-]+ passed$' \
                      "$log_dir/all-qemu-scenarios.txt")" -eq 36

            - name: Run two fresh networking and native HTTPS sweeps
              shell: bash
              run: |
                  set -euo pipefail
                  sweep_root="$RUNNER_TEMP/openrfs-network-sweeps"
                  log_dir="$RUNNER_TEMP/openrfs-network-logs"
                  mapfile -t scenarios < <(
                      make --no-print-directory -s contract-scenarios \
                          | grep '^network-'
                      printf '%s\n' native-https
                  )
                  test "${#scenarios[@]}" -eq 37
                  for sweep in 1 2; do
                      for scenario in "${scenarios[@]}"; do
                          test_dir="build/tests/$scenario"
                          rm -rf -- "$test_dir"
                          make -j2 "qemu-test-$scenario" QEMU_ACCEL=tcg \
                              | tee -a "$log_dir/sweep-$sweep.txt"
                          destination="$sweep_root/sweep-$sweep/$scenario"
                          mkdir -p "$destination"
                          cp "$test_dir/scenario-result.json" \
                              "$test_dir/serial.log" "$destination/"
                          if test -f "$test_dir/packet-audit.json"; then
                              cp "$test_dir/packet-audit.json" \
                                  "$test_dir/network.pcap" "$destination/"
                          fi
                      done
                  done

            - name: Prove no loop-device leak
              shell: bash
              run: |
                  set -euo pipefail
                  log_dir="$RUNNER_TEMP/openrfs-network-logs"
                  loop_after="$log_dir/loop-devices-after.txt"
                  losetup --list --noheadings --output NAME,BACK-FILE \
                      | sort >"$loop_after"
                  if ! test -s "$loop_after"; then
                      printf '<none>\n' >"$loop_after"
                  fi
                  cmp "$log_dir/loop-devices-before.txt" "$loop_after"
                  printf 'no loop-device changes\n' \
                      >"$log_dir/loop-device-diff.txt"

            - name: Assemble and self-inspect exact-head evidence
              shell: bash
              run: |
                  set -euo pipefail
                  release="evidence/OpenRFS-networking-milestone"
                  python3 tools/network_evidence.py assemble \
                      --head "$EVIDENCE_HEAD" \
                      --base "$EVIDENCE_BASE" \
                      --base-tree "$EVIDENCE_BASE_TREE" \
                      --source-tree "$EVIDENCE_SOURCE_TREE" \
                      --merge-tree "$EVIDENCE_MERGE_TREE" \
                      --input build/tests \
                      --sweeps "$RUNNER_TEMP/openrfs-network-sweeps" \
                      --logs "$RUNNER_TEMP/openrfs-network-logs" \
                      --output "$release" \
                      --not-before "$EVIDENCE_NOT_BEFORE"
                  python3 tools/network_evidence.py inspect \
                      --head "$EVIDENCE_HEAD" --input "$release"

            - name: Upload exact-head networking evidence
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ env.EVIDENCE_ARTIFACT }}
                  path: evidence/OpenRFS-networking-milestone
                  if-no-files-found: error
                  retention-days: 90

    inspect-downloaded-evidence:
        name: inspect-downloaded-networking-evidence
        needs: exact-head-evidence
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out the evidence verifier at the exact head
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: ${{ needs.exact-head-evidence.outputs.head }}
                  persist-credentials: false

            - name: Download the uploaded evidence
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.exact-head-evidence.outputs.artifact }}
                  path: downloaded

            - name: Inspect downloaded artifact contents
              env:
                  EXPECTED_HEAD: ${{ needs.exact-head-evidence.outputs.head }}
              shell: bash
              run: |
                  set -euo pipefail
                  mapfile -t identities < <(find downloaded -type f \
                      -name identity.json -print)
                  test "${#identities[@]}" -eq 1
                  evidence=$(dirname "${identities[0]}")
                  python3 tools/network_evidence.py inspect \
                      --head "$EXPECTED_HEAD" --input "$evidence"
