name: RSD release

on:
    push:
        tags:
            - v2.55

permissions:
    contents: write

concurrency:
    group: rsd-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: build and publish RSD 2.55
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        steps:
            - name: Check out tagged source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
            - name: Install build tools
              run: |
                  sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils clang e2fsprogs ffmpeg gcc grub-common grub-pc-bin \
                      lld make mtools python3-cryptography qemu-system-x86 xorriso
            - name: Install the Rust bare-metal target
              run: rustup target add x86_64-unknown-none
            - name: Build the release images
              run: |
                  set -euo pipefail
                  make verify
                  make iso build/userspace/rsd-desktop-system-fat32.raw \
                      build/userspace/rsd-data-fat32.raw
                  python3 tools/capture-rsd-proof.py \
                      --iso build/rsd.iso \
                      --system build/userspace/rsd-desktop-system-fat32.raw \
                      --data build/userspace/rsd-data-fat32.raw \
                      --output build/rsd-captures
                  python3 tools/compare-rsd-proof-screenshot.py --mode clean \
                      assets/rsd/proof.png build/rsd-captures/rsd-proof.png
                  python3 tools/compare-rsd-proof-screenshot.py --mode focus \
                      assets/rsd/proof-focus.png \
                      build/rsd-captures/rsd-proof-focus.png
                  python3 tools/compare-rsd-proof-screenshot.py --mode terminal \
                      assets/rsd/proof-terminal.png \
                      build/rsd-captures/rsd-proof-terminal.png
                  mkdir -p release
                  cp build/rsd.iso release/RSD-v2.55.iso
                  cp build/rsd.elf release/rsd-v2.55.elf
                  cp build/userspace/rsd-desktop-system-fat32.raw \
                      release/rsd-v2.55-system-fat32.raw
                  cp build/userspace/rsd-data-fat32.raw \
                      release/rsd-v2.55-data-fat32.raw
                  cp build/rsd-captures/rsd-proof.png \
                      release/RSD-v2.55-desktop.png
                  cp build/rsd-captures/rsd-proof-focus.png \
                      release/RSD-v2.55-desktop-focus.png
                  cp build/rsd-captures/rsd-proof-terminal.png \
                      release/RSD-v2.55-terminal.png
                  (cd release && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS)
            - name: Publish the tagged release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  cat > release-notes.md <<'NOTES'
                  # RSD 2.55

                  RSD stands for Root Software Distribution. It is an operating system and kernel designed to be read, modified, and forked into your own distribution.

                  RSD 2.55 includes the native command line and a real framebuffer desktop with its applications and icons. The desktop images attached to this release are captured from QEMU booting this exact source. The installer currently previews configuration and does not write to disk. RSD remains experimental.

                  The ISO, kernel ELF, desktop System volume, Data volume, authentic QEMU screenshots, and SHA256 manifest were assembled from this exact tag. The two FAT32 images are required for the desktop boot profile.
                  NOTES
                  printf '\nSource commit: `%s`.\n' "$GITHUB_SHA" >> release-notes.md
                  gh release create "$GITHUB_REF_NAME" release/* \
                      --verify-tag \
                      --title 'RSD 2.55' --notes-file release-notes.md
